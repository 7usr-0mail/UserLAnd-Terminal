name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:        # lets you trigger a build manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest   # 4 vCPU / 16 GB RAM, Android SDK preinstalled

    steps:
      - uses: actions/checkout@v4

      # This project needs JDK 17: Gradle 7.6 / AGP 7.4 will not run on 21+.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # The runner has plenty of memory, so undo the tuning that was needed to
      # squeeze this build onto a 2 GB host.
      - name: Restore normal build memory
        run: |
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m/' gradle.properties
          sed -i 's/^org.gradle.parallel=.*/org.gradle.parallel=true/' gradle.properties
          sed -i '/^org.gradle.workers.max=/d;/^kotlin.compiler.execution.strategy=/d;/^kapt.use.worker.api=/d' gradle.properties
          cat gradle.properties

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UserLAnd-Terminal-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Tagging a commit (e.g. `git tag v3.0.0 && git push --tags`) publishes
      # the APK as a downloadable GitHub Release.
      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
