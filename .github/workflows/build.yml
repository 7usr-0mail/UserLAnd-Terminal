name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:        # lets you trigger a build manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest   # 4 vCPU / 16 GB RAM, Android SDK preinstalled

    steps:
      - uses: actions/checkout@v4

      # This project needs JDK 17: Gradle 7.6 / AGP 7.4 will not run on 21+.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/configuration-cache
            .gradle
            app/build/intermediates
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}-${{ github.sha }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}-
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # The runner has plenty of memory, so undo the tuning that was needed to
      # squeeze this build onto a 2 GB host.
      - name: Restore normal build memory
        run: |
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m/' gradle.properties
          sed -i 's/^org.gradle.parallel=.*/org.gradle.parallel=true/' gradle.properties
          sed -i '/^org.gradle.workers.max=/d;/^kotlin.compiler.execution.strategy=/d;/^kapt.use.worker.api=/d' gradle.properties
          # The sandbox this was developed in had 2 GB RAM and needed these off.
          # CI has 16 GB, so turn the fast paths back on.
          sed -i 's/^kotlin.incremental=false/kotlin.incremental=true/' gradle.properties
          echo 'org.gradle.daemon=true' >> gradle.properties
          echo 'org.gradle.configureondemand=true' >> gradle.properties
          echo 'kotlin.incremental.useClasspathSnapshot=true' >> gradle.properties
          cat gradle.properties

      - name: Build debug APK
        # --build-cache reuses task outputs across runs. abiFilters keeps the
        # APK to arm64 for test installs; remove it to ship all architectures.
        # github.run_number increases monotonically, so every build installs
        # over the previous one instead of being rejected as a downgrade.
        run: ./gradlew :app:assembleDebug --stacktrace --build-cache -PversionCode=${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UserLAnd-Terminal-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Tagging a commit (e.g. `git tag v3.0.0 && git push --tags`) publishes
      # the APK as a downloadable GitHub Release.
      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
