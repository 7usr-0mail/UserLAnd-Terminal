# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx1100m -XX:MaxMetaspaceSize=320m -XX:+UseSerialGC -XX:MaxRAM=1600m
org.gradle.parallel=false
org.gradle.caching=true

android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=false
android.nonFinalResIds=false
# Kotlin synthetics (kotlin-android-extensions) are used throughout this
# codebase; keep the compatibility flag enabled.
android.defaults.buildfeatures.buildconfig=true
android.defaults.buildfeatures.resvalues=true
kotlin.code.style=official
android.suppressUnsupportedCompileSdk=34

# Constrained build host: keep Kotlin/kapt in-process rather than forking a second JVM.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
org.gradle.workers.max=1
kapt.use.worker.api=false

# Trim optional AGP steps that cost memory on a 2GB build host.
android.enableArtProfiles=false
android.enableResourceOptimizations=false
